<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>SBSpots</title>
    <link rel="icon" type="image/png" href="assets/sbspots_logo.png">
    <script src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <button
      class="theme-toggle"
      type="button"
      aria-label="Switch to dark mode"
      disabled
    >
      <svg class="theme-icon-dark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
        <path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z" fill="currentColor" />
      </svg>
      <svg class="theme-icon-light" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4" fill="currentColor" />
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <main class="landing">
      <div class="brand">
        <h1 class="brand-heading">
          <img class="logo" src="assets/sbspots_logo.png" alt="SBSpots" width="1024" height="1536">
        </h1>
        <img
          class="brand-name brand-name-light"
          src="assets/sbspots_name.png"
          alt=""
          width="2172"
          height="724"
        >
        <img
          class="brand-name brand-name-dark"
          src="assets/sbspots_name_dark.png"
          alt=""
          width="2172"
          height="724"
        >
        <p class="tagline">SKATE • EXPLORE • SHARE</p>
        <button class="coming-soon" type="button" aria-disabled="true">
          <span>COMING SOON</span>
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </main>
  </body>
</html>
